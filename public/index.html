<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; resize: vertical; }
    #lookup-form { margin-top: 20px; }
    li button { margin: 8px 8px 0 0; padding: 8px 14px; cursor: pointer; }
    li span { white-space: pre-wrap; }
    .auth button { padding: 10px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .signed-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .auth-message { margin: 10px 0 0; font-size: 15px; min-height: 1.4em; }
    .auth-message.error { color: #ffb4c0; }
    .auth-message.ok { color: #9fe3b0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>로그인해서 가상 메모를 관리하세요. 현재 단계에서는 다른 사용자의 메모도 ID를 알면 수정·삭제할 수 있습니다.</p>
    <div class="notice">로그인한 사용자만 자료를 볼 수 있습니다. 로그인하지 않았거나 로그인 확인에 실패하면 서버가 자료를 보내지 않습니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form" novalidate>
        <label>이메일
          <input id="login-email" type="email" autocomplete="email" required>
        </label>
        <label>비밀번호
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-submit" type="submit">로그인</button>
      </form>
      <div id="signed-in" class="signed-in" hidden>
        <span id="signed-in-label"></span>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
    </section>
    <section id="editor" class="auth" hidden>
      <h2>가상 메모 추가·수정</h2>
      <form id="note-form">
        <label>메모 ID (새 메모는 비워 두세요)<input id="note-id" readonly></label>
        <label>제목<input id="note-title" maxlength="200" required></label>
        <label>내용<textarea id="note-body" maxlength="20000" rows="5" required></textarea></label>
        <button id="note-save" type="submit">저장</button>
        <button id="note-new" type="button">새 메모</button>
      </form>
      <form id="lookup-form">
        <label>UUID로 메모 열기<input id="lookup-id" required></label>
        <button type="submit">열기</button>
      </form>
      <p id="note-message" role="status"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    const list = document.querySelector('#notes');

    function showListMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    // 로그인·토큰 갱신은 서버가 처리하며 브라우저는 보안 쿠키를 자동 전달합니다.
    let loadSequence = 0;
    async function loadNotes(signedIn) {
      const sequence = ++loadSequence;
      if (!signedIn) {
        showListMessage('로그인하면 자료를 볼 수 있습니다.');
        return;
      }
      showListMessage('내 메모를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/learning-notes', {
          cache: 'no-store',
          credentials: 'same-origin',
        });
        if (sequence !== loadSequence) return;
        if (response.status === 401) throw new Error('로그인이 확인되지 않아 자료를 보여 줄 수 없습니다.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (sequence !== loadSequence) return;
        if (!Array.isArray(data)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!data.length) { showListMessage('내 메모가 없습니다. 새 메모를 추가하세요.'); return; }
        list.replaceChildren(...data.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body;
          item.append(title, content);
          const identifier = document.createElement('p');
          identifier.textContent = `ID: ${note.id}`;
          const edit = document.createElement('button');
          edit.textContent = '수정';
          edit.onclick = () => openNote(note.id);
          const remove = document.createElement('button');
          remove.textContent = '삭제';
          remove.onclick = () => deleteNote(note.id);
          item.append(identifier, edit, remove);
          return item;
        }));
      } catch (error) {
        if (sequence === loadSequence) showListMessage(error.message);
      }
    }

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const submitButton = document.querySelector('#login-submit');
    const signedInBox = document.querySelector('#signed-in');
    const signedInLabel = document.querySelector('#signed-in-label');
    const logoutButton = document.querySelector('#logout-button');
    const message = document.querySelector('#auth-message');

    function showMessage(text, kind) {
      message.textContent = text;
      message.className = kind ? `auth-message ${kind}` : 'auth-message';
    }

    function render(session) {
      const signedIn = Boolean(session);
      form.hidden = signedIn;
      signedInBox.hidden = !signedIn;
      signedInLabel.textContent = signedIn ? '로그인했습니다.' : '';
    }


    const editor = document.querySelector('#editor');
    const noteForm = document.querySelector('#note-form');
    const noteId = document.querySelector('#note-id');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteMessage = document.querySelector('#note-message');
    let sessionUser;
    async function noteRequest(method, id, body) {
      const session = await sessionRequest('GET');
      if (!session.signedIn) { updateSession(false); throw new Error('로그인이 필요합니다.'); }
      const response = await fetch(`/api/learning-notes${id ? `/${encodeURIComponent(id)}` : ''}`, {
        method, cache: 'no-store',
        credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(`요청 실패 (${response.status}: ${result.error ?? '오류'})`);
      return result;
    }
    async function refreshNotes() {
      await syncSession();
    }
    async function openNote(id) {
      const user = sessionUser;
      try {
        const note = await noteRequest('GET', id);
        if (!user || user !== sessionUser) return;
        noteId.value = note.id; noteTitle.value = note.title; noteBody.value = note.body;
        noteMessage.textContent = '메모를 열었습니다.';
      } catch (error) { if (user === sessionUser) noteMessage.textContent = error.message; }
    }
    async function deleteNote(id) {
      if (!confirm('이 가상 메모를 삭제할까요?')) return;
      try {
        await noteRequest('DELETE', id);
        if (noteId.value === id) noteForm.reset();
        noteMessage.textContent = '삭제했습니다.';
        await refreshNotes();
      } catch (error) { noteMessage.textContent = error.message; }
    }
    document.querySelector('#note-new').onclick = () => { noteForm.reset(); noteMessage.textContent = ''; };
    document.querySelector('#lookup-form').onsubmit = event => {
      event.preventDefault(); openNote(document.querySelector('#lookup-id').value.trim());
    };
    noteForm.onsubmit = async event => {
      event.preventDefault();
      const button = document.querySelector('#note-save');
      button.disabled = true;
      try {
        await noteRequest(noteId.value ? 'PUT' : 'POST', noteId.value,
          { title: noteTitle.value, body: noteBody.value });
        noteForm.reset(); noteMessage.textContent = '저장했습니다.';
        await refreshNotes();
      } catch (error) { noteMessage.textContent = error.message; }
      finally { button.disabled = false; }
    };
    async function sessionRequest(method, body) {
      const response = await fetch('/api/session', {
        method, credentials: 'same-origin', cache: 'no-store',
        headers: { 'Content-Type': 'application/json', 'X-Vault-Request': '1' },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error ?? '로그인에 실패했습니다.');
      return result;
    }
    function updateSession(signedIn, userId) {
      // Invalidate pending responses when the local session changes.
      ++loadSequence;
      const nextUser = signedIn ? userId : null;
      if (sessionUser !== nextUser) {
        noteForm.reset(); document.querySelector('#lookup-form').reset(); noteMessage.textContent = '';
      }
      sessionUser = nextUser;
      editor.hidden = !signedIn;
      render(signedIn);
      if (!signedIn) showListMessage('로그인하면 자료를 볼 수 있습니다.');
    }
    let syncing;
    async function syncSession() {
      if (syncing) return syncing;
      syncing = (async () => {
        const session = await sessionRequest('GET');
        updateSession(session.signedIn, session.userId);
        await loadNotes(session.signedIn);
      })();
      try { await syncing; } finally { syncing = null; }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      submitButton.disabled = true;
      showMessage('로그인하는 중입니다.');
      try {
        await sessionRequest('POST', { email: emailInput.value.trim(), password: passwordInput.value });
        passwordInput.value = '';
        showMessage('로그인했습니다.', 'ok');
        await syncSession();
      } catch (error) { showMessage(error.message, 'error'); }
      finally { passwordInput.value = ''; submitButton.disabled = false; }
    });
    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      try {
        await sessionRequest('DELETE');
        updateSession(false);
        emailInput.value = ''; passwordInput.value = '';
        showMessage('로그아웃했습니다.', 'ok');
      } catch (error) { showMessage(error.message, 'error'); }
      finally { logoutButton.disabled = false; }
    });
    window.addEventListener('focus', () => syncSession().catch(error => showMessage(error.message, 'error')));
    try { await syncSession(); }
    catch (error) { updateSession(false); showMessage(error.message, 'error'); }
  </script>
</body>
</html>
